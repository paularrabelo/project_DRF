name: Python application

on: [push]

jobs:
 build:
  strategy:
   fail-fast: false
   matrix:
    python-version: [3.12]

  runs-on: ubuntu-latest

  steps:
  - uses: actions/checkout@v2

  - name: Set up Python ${{ matrix.python-version }}
    uses: actions/setup-python@v2
    with:
      python-version: ${{ matrix.python-version }}

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  # Adicionando migrações do banco de dados
  - name: Run migrations
    run: |
      python manage.py migrate

  # # Iniciar o servidor Django em segundo plano
  # - name: Run Django server
  #   run: |
  #     python manage.py runserver
  #   env:
  #     DJANGO_SETTINGS_MODULE: escola.settings # Altere para o seu módulo de configurações

  # # Adicionando um tempo de espera para o servidor inicializar
  # - name: Wait for server to start
  #   run: sleep 5

  - name: Run tests
    run: python manage.py test